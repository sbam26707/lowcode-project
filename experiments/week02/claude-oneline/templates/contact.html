<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact</title>
<style>
body{font-family:sans-serif;max-width:480px;margin:2rem auto;padding:0 1rem}
label{display:block;margin-top:1rem;font-weight:bold}
input,textarea{width:100%;padding:.5rem;box-sizing:border-box}
.error{color:#b00020;font-size:.9rem}
.flash{background:#e6f4ea;padding:.75rem;border-radius:4px}
button{margin-top:1rem;padding:.6rem 1.2rem}
</style>
</head>
<body>
<h1>Contact us</h1>
{% for m in get_flashed_messages() %}<p class="flash">{{ m }}</p>{% endfor %}
<form method="post" action="{{ url_for('contact') }}" novalidate>
  <label for="name">Name</label>
  <input id="name" name="name" value="{{ form.name }}" required>
  {% if errors.name %}<div class="error">{{ errors.name }}</div>{% endif %}
  <label for="email">Email</label>
  <input id="email" name="email" type="email" value="{{ form.email }}" required>
  {% if errors.email %}<div class="error">{{ errors.email }}</div>{% endif %}
  <label for="message">Message</label>
  <textarea id="message" name="message" rows="6" required>{{ form.message }}</textarea>
  {% if errors.message %}<div class="error">{{ errors.message }}</div>{% endif %}
  <button type="submit">Send</button>
</form>
</body>
</html>
